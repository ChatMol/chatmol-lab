name: build-desktop

# Pushing a tag like v1.0.0 builds both installers and opens a draft GitHub
# Release with them attached, which is the only place users get them.
# Pushes to main and pull requests build without keeping the installer, just
# to prove packaging still works.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: web
      - run: npm test
      - run: npm run lint
      - run: npm run harness:verify
      - run: npm run build
      # Build success says nothing about whether the server boots. See the script.
      - run: npm run smoke:standalone

  package:
    if: github.event_name != 'pull_request'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
            builder_args: --mac dmg --arm64
            installer: dist/*.dmg
          - os: windows-latest
            target: win
            builder_args: --win nsis --x64
            installer: dist/*.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: web
      - run: npm run build
      - run: npm run electron:compile
      - run: npm run electron:template-db
      - run: npm run electron:runtime
        env:
          RUNTIME_TARGET: ${{ matrix.target }}
      - name: Package installer
        # bash on every runner: PowerShell mis-parses electron-builder's flags.
        shell: bash
        run: npx electron-builder ${{ matrix.builder_args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Straight to the release: release assets do not come out of the
      # account's Actions storage, which a ~250 MB installer per run exhausts.
      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            note_args=(--notes-file "$notes")
          else
            note_args=(--generate-notes)
          fi
          # Both matrix jobs race to get here; whichever loses just sees the
          # release already there. Draft because the installers are unsigned —
          # drop --draft to publish straight from the tag.
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ChatMol Lab ${GITHUB_REF_NAME#v}" \
              --draft \
              "${note_args[@]}" || gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber ${{ matrix.installer }}

      # Pushes to main only prove the installer builds. Keeping a ~250 MB
      # copy of it needs more Actions storage than the account has, and a
      # tag already puts the real one on the release.
      - name: Check the installer was produced
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          ls -la ${{ matrix.installer }}

  checksums:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish SHA256SUMS for what the release actually holds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.dmg' --pattern '*.exe' --dir installers
          cd installers
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber SHA256SUMS.txt
